<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGuard 360 | AI Student Success & Smart Campus Support Platform</title>
  <meta name="description" content="EduGuard 360: AI-Powered Academic Risk Prediction, Early Mentorship Interventions, and Smart Campus Complaint Resolution." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts & Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>




  <!-- Application Shell -->
  <div class="app-shell">
    <!-- Responsive Left Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <div class="brand-text">
          <h1>EDUGUARD 360</h1>
          <p>Identify • Support • Resolve</p>
        </div>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav">
        <div class="nav-section-title">Core Modules</div>
        <a class="nav-item active" data-view="student" href="#student">
          <i class="fas fa-chart-pie"></i>
          <span>Student Academic Risk</span>
        </a>
        <a class="nav-item" data-view="complaints" href="#complaints">
          <i class="fas fa-headset"></i>
          <span>Campus Complaints</span>
        </a>

        <div class="nav-section-title">Smart Features</div>
        <a class="nav-item" onclick="Chatbot.openWithMessage('Why is my risk high?'); return false;" href="#">
          <i class="fas fa-robot"></i>
          <span>EduGuard AI Bot</span>
        </a>
        <a class="nav-item" onclick="UI.openComplaintModal(); return false;" href="#">
          <i class="fas fa-bullhorn"></i>
          <span>Report Facility Issue</span>
        </a>
        <a class="nav-item nav-item-sos" onclick="Emergency.open(); return false;" href="#" style="color: #ef4444;">
          <i class="fas fa-shield-heart" style="color: #ef4444;"></i>
          <span>Emergency Help (SOS)</span>
          <span class="nav-badge" style="background: #ef4444; color: #fff;">112</span>
        </a>
      </nav>

      <!-- Active User Profile Box -->
      <div class="sidebar-user" style="display: flex; align-items: center;">
        <div id="current-user-avatar" class="user-avatar">R</div>
        <div class="user-info" style="flex-grow: 1;">
          <div id="current-user-name" class="user-name">Rahul Sharma</div>
          <div id="current-user-role" class="user-role-badge">STUDENT</div>
        </div>
        <button id="sidebar-logout-btn" class="icon-btn" title="Sign Out" aria-label="Sign out" style="color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 6px;">
          <i class="fas fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Top Sticky Action Bar -->
      <div class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="topbar-title-wrapper">
            <div class="topbar-breadcrumb">
              <span class="topbar-breadcrumb-item"><i class="fas fa-shield-halved"></i> EduGuard</span>
              <span class="topbar-breadcrumb-separator">/</span>
            </div>
            <h2 id="topbar-view-title" class="view-title">
              Student Academic & Campus Portal
            </h2>
          </div>
        </div>

        <!-- Global Role-Filtered Quick Search -->
        <div class="topbar-search-wrapper">
          <div class="topbar-search-box">
            <i class="fas fa-search topbar-search-icon"></i>
            <input type="text" id="global-search-input" class="topbar-search-input" placeholder="Search complaints, subjects, students..." autocomplete="off">
            <kbd class="topbar-search-kbd">⌘K</kbd>
          </div>
          <div id="global-search-dropdown" class="search-dropdown"></div>
        </div>

        <div class="topbar-right">
          <!-- Atlas Live Cloud Connection Indicator -->
          <div class="topbar-status-badge" title="Live Database: Connected to MongoDB Atlas Cloud">
            <span class="status-pulse-dot"></span>
            <span class="status-text">Atlas Live</span>
          </div>

          <div class="topbar-divider"></div>

          <!-- Real-Time Notification Bell Button -->
          <button id="notif-toggle-btn" class="icon-btn" title="View Notifications" aria-label="Notifications">
            <i class="fas fa-bell"></i>
            <span id="notif-badge" class="badge-count" style="display: none;">0</span>
          </button>

          <!-- Theme Toggle (Dark / Light) -->
          <button id="theme-toggle-btn" class="icon-btn" title="Toggle Dark / Light Theme" aria-label="Theme toggle">
            <i class="fas fa-sun"></i>
          </button>

          <div class="topbar-divider"></div>

          <!-- Quick User Profile Chip in Topbar -->
          <div class="topbar-user-pill" id="topbar-user-pill" title="Active Session">
            <div id="topbar-user-avatar" class="topbar-avatar">R</div>
            <div class="topbar-user-info">
              <span id="topbar-user-name" class="topbar-name">Rahul Sharma</span>
              <span id="topbar-user-role" class="topbar-role">STUDENT</span>
            </div>
          </div>

          <!-- Sign Out Action -->
          <button id="topbar-logout-btn" class="icon-btn icon-btn-danger" title="Sign Out" aria-label="Sign out">
            <i class="fas fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <!-- Dynamic View Container -->
      <div id="main-view-container" class="content-body">
        <!-- Rendered dynamically by view controllers -->
      </div>
    </main>
  </div>

  <!-- Toast Notification Floating Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Global Modal Dialog -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1.15rem; font-weight: 700;">Modal Title</h3>
        <button id="modal-close-btn" style="background: none; border: none; font-size: 1.25rem; color: var(--text-secondary); cursor: pointer;">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Injected via UI.showModal() -->
      </div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Third Party Libraries -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Application Modules -->
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/components/emergency.js"></script>
  <script src="/js/components/chatbot.js"></script>
  <script src="/js/views/studentView.js"></script>
  <script src="/js/views/facultyView.js"></script>
  <script src="/js/views/complaintsView.js"></script>
  <script src="/js/views/adminView.js"></script>
  <script src="/js/app.js"></script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] Service Worker registered with scope:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
