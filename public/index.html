<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGuard 360 | AI Student Success & Smart Campus Support Platform</title>
  <meta name="description" content="EduGuard 360: AI-Powered Academic Risk Prediction, Early Mentorship Interventions, and Smart Campus Complaint Resolution." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts & Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- Hackathon Evaluator Quick Role Switcher Bar -->
  <header class="demo-role-bar" aria-label="Demo Role Selector">
    <div style="display: flex; align-items: center; gap: 8px;">
      <i class="fas fa-bolt" style="color: #fbbf24;"></i>
      <strong>EVALUATOR QUICK ROLE SWITCHER:</strong>
    </div>
    <div class="demo-role-pills">
      <button class="demo-pill active" data-role="STUDENT" title="Switch to Rahul Sharma (High Risk Demo Student)">
        <i class="fas fa-user-graduate"></i> Student (Rahul - High Risk)
      </button>
      <button class="demo-pill" data-role="FACULTY" title="Switch to Dr. Ramesh Kumar (CS Faculty Mentor)">
        <i class="fas fa-chalkboard-teacher"></i> Faculty (Dr. Ramesh)
      </button>
      <button class="demo-pill" data-role="DEPARTMENT_STAFF" title="Switch to Suresh Patel (IT Field Tech)">
        <i class="fas fa-wrench"></i> Dept Staff (Suresh - IT)
      </button>
      <button class="demo-pill" data-role="DEPARTMENT_HEAD" title="Switch to Priya Nair (IT Head)">
        <i class="fas fa-building-user"></i> Dept Head (Priya - IT)
      </button>
      <button class="demo-pill" data-role="ADMIN" title="Switch to System Dean / Administrator">
        <i class="fas fa-shield-halved"></i> Admin (Dean)
      </button>
    </div>
  </header>

  <!-- Application Shell -->
  <div class="app-shell">
    <!-- Responsive Left Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <div class="brand-text">
          <h1>EDUGUARD 360</h1>
          <p>Identify • Support • Resolve</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Core Modules</div>
        <a class="nav-item active" data-view="student" href="#student">
          <i class="fas fa-chart-pie"></i>
          <span>Student Academic Risk</span>
        </a>
        <a class="nav-item" data-view="faculty" href="#faculty">
          <i class="fas fa-user-doctor"></i>
          <span>Faculty Mentorship</span>
          <span class="nav-badge" style="background: var(--risk-critical);">At-Risk</span>
        </a>
        <a class="nav-item" data-view="complaints" href="#complaints">
          <i class="fas fa-headset"></i>
          <span>Campus Complaints</span>
        </a>
        <a class="nav-item" data-view="admin" href="#admin">
          <i class="fas fa-sliders"></i>
          <span>Executive Analytics</span>
        </a>

        <div class="nav-section-title">Smart Features</div>
        <a class="nav-item" onclick="Chatbot.openWithMessage('Why is my risk high?'); return false;" href="#">
          <i class="fas fa-robot"></i>
          <span>EduGuard AI Bot</span>
        </a>
        <a class="nav-item" onclick="UI.openComplaintModal(); return false;" href="#">
          <i class="fas fa-bullhorn"></i>
          <span>Report Facility Issue</span>
        </a>
      </nav>

      <!-- Active User Profile Box -->
      <div class="sidebar-user">
        <div id="current-user-avatar" class="user-avatar">R</div>
        <div class="user-info">
          <div id="current-user-name" class="user-name">Rahul Sharma</div>
          <div id="current-user-role" class="user-role-badge">STUDENT</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Top Sticky Action Bar -->
      <div class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation menu">
            <i class="fas fa-bars"></i>
          </button>
          <div id="topbar-view-title" class="view-title">
            Student Academic & Campus Portal
          </div>
        </div>

        <div class="topbar-right">
          <!-- Real-Time Notification Bell Button -->
          <button id="notif-toggle-btn" class="icon-btn" title="View Notifications" aria-label="Notifications">
            <i class="fas fa-bell"></i>
            <span id="notif-badge" class="badge-count" style="display: none;">0</span>
          </button>

          <!-- Theme Toggle (Dark / Light) -->
          <button id="theme-toggle-btn" class="icon-btn" title="Toggle Dark / Light Theme" aria-label="Theme toggle">
            <i class="fas fa-sun"></i>
          </button>
        </div>
      </div>

      <!-- Dynamic View Container -->
      <div id="main-view-container" class="content-body">
        <!-- Rendered dynamically by view controllers -->
      </div>
    </main>
  </div>

  <!-- Toast Notification Floating Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Global Modal Dialog -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1.15rem; font-weight: 700;">Modal Title</h3>
        <button id="modal-close-btn" style="background: none; border: none; font-size: 1.25rem; color: var(--text-secondary); cursor: pointer;">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Injected via UI.showModal() -->
      </div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Third Party Libraries -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Application Modules -->
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/components/chatbot.js"></script>
  <script src="/js/views/studentView.js"></script>
  <script src="/js/views/facultyView.js"></script>
  <script src="/js/views/complaintsView.js"></script>
  <script src="/js/views/adminView.js"></script>
  <script src="/js/app.js"></script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] Service Worker registered with scope:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
